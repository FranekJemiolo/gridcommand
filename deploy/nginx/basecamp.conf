server {
    listen 80;
    server_name _;

    # Captive portal redirection for zero-conf field deployment
    location /generate_204 {
        return 302 /;
    }
    location /hotspot-detect.html {
        return 302 /;
    }
    location /ncsi.txt {
        return 200 "Microsoft NCSI";
    }

    # API reverse proxy to FastAPI Ingress
    location /api/v1/ {
        proxy_pass http://backend-ingress:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # GM Command Center Dashboard
    location /gm/ {
        alias /usr/share/nginx/html/gm/;
        index index.html;
        try_files $uri $uri/ /gm/index.html;
    }

    # Tactical Field Client (Mobile PWA)
    location / {
        root /usr/share/nginx/html/mobile;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively, keep service worker fresh
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pmtiles|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
}
